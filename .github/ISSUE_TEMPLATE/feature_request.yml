name: Feature request
description: Something the ghost should learn to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Heads-up before you write: outside PRs aren't merged directly (see the README's
        contributions note), but ideas are read and the good ones get built.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do when the tool came up short — the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd want it to do
      description: The behavior you'd expect, ideally as a concrete before/after.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety angle
      description: >
        Ghost Type types into live terminals and runs unattended — if your idea touches
        injection, cloning, budgets, or kill paths, say how it stays inside the guarantees
        in the README's "Safe by construction" table.
