name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Zero dependencies — nothing to install. The suite runs fully offline
      # against the fake engine, so it never spends a token or hits the network.
      - name: Run tests
        run: node --test
