name: CI

# Public repo → free runners, so every push runs the suite. It's `node --test` —
# offline, zero tokens, no install step.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Zero dependencies — nothing to install. The suite runs fully offline
      # against the fake engine, so it never spends a token or hits the network.
      - name: Run tests
        run: node --test
