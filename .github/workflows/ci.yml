name: CI

# Manual trigger only, deliberately: GitHub refuses to start Actions jobs on this
# account's private repos ("spending limit / billing"), so a push trigger just paints
# every commit with a red ✗ that says nothing about the code. Restore `push:` here if
# the repo goes public or billing is enabled. The suite is `node --test` — offline,
# zero tokens, and runs on every local change anyway.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Zero dependencies — nothing to install. The suite runs fully offline
      # against the fake engine, so it never spends a token or hits the network.
      - name: Run tests
        run: node --test
