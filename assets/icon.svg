             C 8 100, 13 102, 16 99
             L 24 91
             C 26 89, 30 89, 32 91
             L 40 99
             C 42 101, 46 101, 48 99
             L 52 95
             L 56 99
             C 58 101, 62 101, 64 99
             L 72 91
             C 74 89, 78 89, 80 91
             L 88 99
             C 91 102, 96 100, 96 96
             L 96 52
             C 96 26, 80 4, 52 4 Z"
          fill="url(#body)"/>
    <circle cx="38" cy="46" r="6.5" fill="#14101f"/>
    <circle cx="66" cy="46" r="6.5" fill="#14101f"/>
    <rect x="44" y="62" width="7" height="16" rx="1.5" fill="#14101f"/>
  </g>
